name: Build OZK Donations for OBS 33
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake --preset windows-ci-x64
      - name: Build
        run: cmake --build --preset windows-x64 --config RelWithDebInfo --parallel
      - name: Test
        run: ctest --test-dir build_x64 -C RelWithDebInfo --output-on-failure
      - name: Render donation panel with example data
        shell: pwsh
        run: |
          $qtRoot = Join-Path $PWD ".deps/obs-deps-qt6-2026-10-23-x64"
          $env:PATH = "$qtRoot/bin;$PWD/build_x64/qtwebsockets-install/bin;$env:PATH"
          $env:QT_PLUGIN_PATH = "$qtRoot/plugins"
          & ./build_x64/RelWithDebInfo/ozk-donations-ui-preview.exe ui-previews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OZKDonations-UI-Previews
          path: ui-previews/*.png
          if-no-files-found: error
      - name: Package OBS 33 layout
        shell: pwsh
        run: |
          cmake --install build_x64 --config RelWithDebInfo --prefix package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = 'package/ozk-donations/bin/64bit'
          foreach ($file in Get-ChildItem $bin -File) { Move-Item -LiteralPath $file.FullName -Destination 'package/ozk-donations' -Force }
          Remove-Item $bin
          Remove-Item 'package/ozk-donations/bin'
          if (!(Test-Path package/ozk-donations/ozk-donations.dll)) { throw 'OBS plugin DLL missing' }
          if (!(Test-Path package/ozk-donations/data/qt-plugins/tls/qschannelbackend.dll)) { throw 'TLS backend missing' }
          Copy-Item README.md package/README.md
          Copy-Item LICENSE package/LICENSE
          Copy-Item THIRD_PARTY.md package/THIRD_PARTY.md
          Compress-Archive -Path package/* -DestinationPath OZK-Donations-0.6.5-OBS33-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OZK-Donations-0.6.5-OBS33-Windows-x64
          path: OZK-Donations-0.6.5-OBS33-Windows-x64.zip
          if-no-files-found: error
